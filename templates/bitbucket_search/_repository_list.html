{% if repositories %}
<ul class="bb-repository-list" data-repository-list>
    {% for repository in repositories %}
    <li class="bb-repository-card" data-repository-id="{{ repository.pk }}" data-repository-state="{{ repository.sync_state }}" data-repository-search-value="{{ repository.display_name }} {{ repository.canonical_remote_key }} {{ repository.default_branch }}">
        <div class="bb-repository-card__main">
            <span class="bb-repository-state bb-repository-state--{{ repository.sync_state }}" data-repository-state-icon role="img" aria-label="{{ repository.display_name }}: {{ repository.get_sync_state_display }}">
                <svg class="bb-state-icon bb-state-icon--ready" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
                <svg class="bb-state-icon bb-state-icon--active" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v11M8 10l4 4 4-4M5 19h14"/></svg>
                <svg class="bb-state-icon bb-state-icon--attention" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16.5v.5"/></svg>
                <svg class="bb-state-icon bb-state-icon--idle" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 7.5h6l1.7 2h9.3v9.5h-17V7.5Z"/></svg>
            </span>
            <span class="bb-repository-card__copy">
                <strong data-repository-name>{{ repository.display_name }}</strong>
                <small data-repository-documents>{{ repository.pdf_count }} PDF · {{ repository.vsdx_count }} VSDX</small>
                <small
                    class="bb-repository-worker-timer"
                    data-repository-worker-timer
                    data-worker-started-at="{{ repository.worker_timing.startedAt|default:'' }}"
                    data-worker-observed-at="{{ repository.worker_timing.observedAt|default:'' }}"
                    data-worker-label="{{ repository.worker_timing.label|default:'' }}"
                    data-worker-kind="{{ repository.worker_timing.kind|default:'' }}"
                    title="Elapsed time for the current worker"
                    aria-live="off"
                    hidden
                ></small>
            </span>
            <form method="post" action="{% url 'bitbucket_search:repository_refresh' repository.pk %}" data-repository-refresh-form>
                {% csrf_token %}
                <button type="submit" title="Refresh repository" aria-label="Refresh {{ repository.display_name }} in the background"{% if repository.has_active_sync %} disabled{% endif %}>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 8a8 8 0 1 0 1 6M19 4v4h-4"/></svg>
                </button>
            </form>
        </div>
    </li>
    {% endfor %}
</ul>
{% endif %}
