<div class="bb-repository-selection-toolbar" role="group" aria-label="Selected repository actions">
    <button class="bb-repository-tool" type="submit" name="operation" value="refresh" form="bb-repository-selection-form" title="Refresh selected repositories" aria-label="Refresh selected repositories" data-selected-refresh disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-selected-refresh-icon><path d="M19 8a7.5 7.5 0 1 0 1 7"/><path d="M19 3v5h-5"/></svg>
        <span class="bb-refresh-all__spinner" aria-hidden="true" data-selected-refresh-spinner hidden></span>
    </button>
    <button class="bb-repository-tool" type="submit" name="operation" value="exclude" form="bb-repository-selection-form" title="Exclude selected repositories from refresh" aria-label="Exclude selected repositories from refresh" data-selected-exclude disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M9.5 8.5v7M14.5 8.5v7"/></svg>
    </button>
    <button class="bb-repository-tool bb-repository-tool--stop" type="submit" name="operation" value="stop_indexing" form="bb-repository-selection-form" title="Select a repository with active PDF indexing to stop" aria-label="Select a repository with active PDF indexing to stop" data-selected-stop-indexing disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M9 9h6v6H9z"/></svg>
    </button>
    <button class="bb-repository-tool bb-repository-tool--danger" type="submit" name="operation" value="remove" form="bb-repository-selection-form" title="Select repositories to delete" aria-label="Select repositories to delete" data-delete-locked="true" data-selected-remove disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-selected-delete-lock-icon><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-selected-delete-action-icon hidden><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
    </button>
</div>
