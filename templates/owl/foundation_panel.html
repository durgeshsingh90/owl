<section class="foundation-panel" aria-labelledby="foundation-heading">
    <div class="foundation-panel__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M4 19h16M6.5 19V9.5L12 5l5.5 4.5V19M9 19v-5h6v5"/></svg>
    </div>
    <div class="foundation-panel__body">
        <p class="eyebrow">{{ eyebrow }}</p>
        <h1 id="foundation-heading">{{ heading }}</h1>
        <p class="lede">{{ description }}</p>
        <div class="not-active-note">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6.5v.5"/></svg>
            <p><strong>This feature is not active yet.</strong> The page remains an honest part of the current OWL shell and does not run hidden work.</p>
        </div>
    </div>
    <aside class="foundation-panel__aside" aria-labelledby="planned-capabilities-heading">
        <h2 id="planned-capabilities-heading">What this will provide</h2>
        <ul class="check-list check-list--planned">
            {% for capability in capabilities %}
                <li>{{ capability }}</li>
            {% endfor %}
        </ul>
    </aside>
</section>
