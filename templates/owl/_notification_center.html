<div
    class="notification-center"
    data-notification-center
    data-notifications-url="{% url 'bookmark_manager:notifications' %}"
    data-read-url="{% url 'bookmark_manager:notifications_read' %}"
    data-read-all-url="{% url 'bookmark_manager:notifications_read_all' %}"
    data-schedule-tick-url="{% url 'bookmark_manager:refresh_schedule_tick' %}"
>
    <form class="notification-center__csrf" hidden aria-hidden="true">
        {% csrf_token %}
    </form>
    <iframe name="owl-bitbucket-schedule-tick" title="Bitbucket schedule check" tabindex="-1" hidden aria-hidden="true"></iframe>
    <form method="post" action="{% url 'bitbucket_search:repository_schedule_tick' %}" target="owl-bitbucket-schedule-tick" hidden aria-hidden="true" data-bitbucket-schedule-tick-form>
        {% csrf_token %}
    </form>
    <button
        class="notification-center__toggle"
        type="button"
        title="Notifications"
        aria-label="Open notifications"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="owl-notification-panel"
        data-notification-toggle
    >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.5 9.8a5.5 5.5 0 0 1 11 0c0 6.1 2.5 6.7 2.5 6.7H4s2.5-.6 2.5-6.7Z"/>
            <path d="M9.5 19a2.8 2.8 0 0 0 5 0"/>
        </svg>
        <span class="notification-center__badge" data-notification-badge hidden>0</span>
    </button>

    <section
        class="notification-center__panel"
        id="owl-notification-panel"
        role="dialog"
        aria-modal="false"
        aria-labelledby="owl-notification-heading"
        tabindex="-1"
        data-notification-panel
        hidden
    >
        <header class="notification-center__header">
            <div>
                <p>OWL activity</p>
                <h2 id="owl-notification-heading">Notifications</h2>
            </div>
            <button class="notification-center__mark-all" type="button" data-notification-read-all hidden>Mark all read</button>
        </header>

        <div class="notification-center__live visually-hidden" role="status" aria-live="polite" aria-atomic="true" data-notification-live></div>

        <div class="notification-center__section-heading notification-center__section-heading--updates">
            <h3 title="Current repository status is available from Background status.">Notification history</h3>
            <span data-notification-unread-label>No unread</span>
        </div>
        <div class="notification-center__list" data-notification-list aria-busy="true"></div>
        <div class="notification-center__empty" data-notification-empty hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 9.8a5.5 5.5 0 0 1 11 0c0 6.1 2.5 6.7 2.5 6.7H4s2.5-.6 2.5-6.7Z"/><path d="M9.5 19a2.8 2.8 0 0 0 5 0"/></svg>
            <strong>No notifications yet</strong>
            <small>Import, export, Confluence, and Bitbucket refresh updates will appear here.</small>
        </div>
    </section>
</div>
