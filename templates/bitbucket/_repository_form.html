<form class="bb-repository-form" method="post" action="{% url 'bitbucket:repository_add' %}" data-repository-add-form>
    {% csrf_token %}
    <label for="{{ form_id|default:'bb-repository-url' }}">HTTPS Git URLs</label>
    <textarea
        id="{{ form_id|default:'bb-repository-url' }}"
        name="repository_url"
        rows="5"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="https://bitbucket.org/workspace/repository-one.git&#10;https://bitbucket.org/workspace/repository-two.git"
        required
    ></textarea>
    <small>Paste one repository URL per line. Blank lines are ignored; up to 100 repositories can be added at once.</small>
    <button type="submit">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v12M7 9l5-5 5 5M5 19h14"/></svg>
        Add &amp; clone in background
    </button>
    <small>HTTPS only. OWL approves the exact submitted host, clones once, then uses a safe fetch and fast-forward pull.</small>
</form>
