name: Public CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Synthetic quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-synthetic-secret-key-not-for-real-use-0123456789-abcdef
      DJANGO_DEBUG: "false"
      DJANGO_LOG_LEVEL: WARNING
      OWL_LOG_LEVEL: WARNING
      OWL_TIME_ZONE: UTC
      OWL_DATA_ROOT: ${{ runner.temp }}/owl-data
      CONFLUENCE_BASE_URL: ""
      CONFLUENCE_PAT: ""
      CONFLUENCE_AUTH_MODE: bearer
      CONFLUENCE_SECRET_BACKEND: memory
      OWL_ALLOW_IN_MEMORY_SECRET_STORE: "true"
      OWL_ALLOW_NON_LOOPBACK: "false"
      BITBUCKET_ALLOWED_HOSTS: ""
      OWL_ALLOW_LIVE_EXTERNAL_TESTS: "false"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out public source only
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reject tracked runtime files and likely secrets
        run: python scripts/check_tracked_files.py

      - name: Install the locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.5
          uv sync --locked --all-extras

      - name: Check formatting and code quality
        run: |
          uv lock --check
          uv run --locked ruff format --check .
          uv run --locked ruff check .

      - name: Check Django and migration state
        run: |
          uv run --locked python manage.py check
          uv run --locked python manage.py makemigrations --check --dry-run
          uv run --locked python manage.py migrate --noinput

      - name: Run synthetic tests with coverage
        run: |
          uv run --locked coverage run -m pytest
          uv run --locked coverage report
