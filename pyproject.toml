[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-workspace-locator"
version = "0.1.0"
description = "A local Confluence bookmark manager and indexed PDF search tool."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "cryptography==50.0.0",
    "Django==6.1",
    "fastembed==0.8.0",
    "huggingface-hub==1.29.0",
    "keyring==25.7.0",
    "numpy==2.5.2",
    "pypdf==6.16.2",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.4",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.4",
    "uv==0.12.5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["owl*", "core*", "bookmark_manager*", "bitbucket_search*", "semantic_search*"]

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "owl.settings_test"
addopts = """
-ra
--strict-config
--strict-markers
-m "not live_external"
"""
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests", "bookmark_manager", "bitbucket_search"]
markers = [
    "browser: visible browser and accessibility journeys",
    "live_external: opt-in checks that use a real external system (excluded by default)",
    "slow: tests that are intentionally slower than the normal local suite",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "**/migrations",
    ".venv",
    "backups",
    "data",
    "indexes",
    "imports",
    "logs",
    "media",
    "repositories",
    "staticfiles",
    "tmp",
    "var",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["owl", "core", "bookmark_manager", "bitbucket_search", "semantic_search"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "owl/asgi.py",
    "owl/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
