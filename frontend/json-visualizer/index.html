<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OWL · JSON Visualizer</title>
  <link rel="icon" href="../bitbucket/assets/owl.png">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="../bitbucket/theme.js?v=20260914-current-mode"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../home/" aria-label="OWL home"><img src="../bitbucket/assets/owl.png" alt=""><span>OWL<small>JSON Visualizer</small></span></a>
  <div class="top-actions">
    <button id="open-button" type="button" title="Open JSON, JSONL, JSON5 or .gz files (Ctrl+O)">Open</button>
    <button id="paste-button" type="button" title="Paste JSON from the clipboard (Ctrl+V)">Paste</button>
    <label class="format-pick" title="Format: detected automatically, or choose one to read the file again">
      <span class="sr-only">Format</span>
      <select id="format-select" disabled>
        <option value="auto">Auto format</option><option value="json">JSON</option><option value="jsonl">JSON Lines</option><option value="json5">JSON5</option>
      </select>
    </label>
  </div>
  <div class="views" role="group" aria-label="View">
    <button type="button" data-view="auto" aria-pressed="true" title="Choose the view from the data's shape">Auto <small id="auto-view"></small></button>
    <button type="button" data-view="tree" aria-pressed="false" title="Collapsible tree">Tree</button>
    <button type="button" data-view="table" aria-pressed="false" title="Arrays of objects as a table">Table</button>
    <button type="button" data-view="card" aria-pressed="false" title="Objects as key/value cards">Card</button>
    <button type="button" data-view="raw" aria-pressed="false" title="Formatted JSON with line numbers and folding">Raw</button>
  </div>
  <nav>
    <div class="menu-wrap">
      <button id="export-button" type="button" aria-haspopup="menu" aria-expanded="false" disabled>Export ▾</button>
      <div id="export-menu" class="popover" role="menu" hidden>
        <button type="button" role="menuitem" data-export="csv">Table as CSV (visible rows and columns)</button>
        <button type="button" role="menuitem" data-export="table-json">Table rows as JSON</button>
        <button type="button" role="menuitem" data-export="json">Current node as formatted JSON</button>
        <button type="button" role="menuitem" data-export="min">Current node as minified JSON</button>
      </div>
    </div>
    <button id="tz-toggle" type="button" title="Show times in local time or UTC">Local time</button>
    <a href="../home/">Home ↗</a>
    <button id="theme-toggle" type="button" aria-label="Switch color theme"><span>◐</span></button>
  </nav>
</header>

<div id="tabs" class="tabs" role="tablist" aria-label="Open documents"></div>

<main id="workspace" class="workspace" hidden>
  <aside class="left" aria-label="Document outline">
    <section id="outline"></section>
    <section class="recent-side"><div class="side-title">Recent files <button id="clear-history" class="link" type="button" title="Delete every saved recent file">Clear</button></div><div id="recent-side"></div></section>
  </aside>
  <section class="center">
    <div class="center-head">
      <nav id="breadcrumb" class="breadcrumb" aria-label="Path"></nav>
      <div id="view-tools" class="view-tools"></div>
      <form id="goto-form" class="goto" title="Go to a path, for example Reservations[0].Instances[2]"><input id="goto-input" placeholder="Go to path…" autocomplete="off" spellcheck="false"></form>
    </div>
    <div id="view" class="view"></div>
  </section>
  <aside id="detail" class="detail" aria-label="Details"></aside>
</main>

<section id="empty" class="empty">
  <div class="drop-card">
    <div class="drop-icon">{ }</div>
    <h1>Drop JSON here</h1>
    <p>AWS, Azure, kubectl, Terraform or any JSON, JSON Lines or JSON5 output (also .gz). Everything is read in your browser; nothing is uploaded.</p>
    <div class="drop-actions"><button id="empty-open" class="primary" type="button">Open files</button><button id="empty-paste" type="button">Paste JSON</button></div>
    <small>Or press Ctrl+V anywhere on this page.</small>
    <div id="recent-empty" class="recent-empty"></div>
  </div>
</section>

<footer id="bottom" class="bottom" hidden>
  <form id="search-form" class="search" role="search">
    <input id="search-input" type="search" placeholder="Search keys and values (Ctrl+F)" autocomplete="off" spellcheck="false">
    <div class="search-options" role="group" aria-label="Search options">
      <button type="button" data-option="caseSensitive" aria-pressed="false" title="Match case">Aa</button>
      <button type="button" data-option="wholeWord" aria-pressed="false" title="Whole word">W</button>
      <button type="button" data-option="regex" aria-pressed="false" title="Regular expression">.*</button>
      <select id="search-scope" title="Search keys, values or both"><option value="both">Keys + values</option><option value="keys">Keys only</option><option value="values">Values only</option></select>
    </div>
    <span id="search-count" class="search-count" aria-live="polite"></span>
    <button id="search-prev" type="button" title="Previous match (Shift+Enter)">↑</button>
    <button id="search-next" type="button" title="Next match (Enter)">↓</button>
    <button id="search-cancel" type="button" title="Stop searching" hidden>Stop</button>
  </form>
  <div id="status" class="status"></div>
</footer>

<div id="drop-overlay" class="drop-overlay" hidden><div>Drop to open · drop on a tab to replace it</div></div>
<div id="menu" class="context-menu" role="menu" hidden></div>
<div id="popover" class="popover floating" hidden></div>
<dialog id="paste-dialog">
  <form method="dialog" id="paste-form">
    <h2>Paste JSON</h2>
    <textarea id="paste-text" spellcheck="false" placeholder="Paste JSON, JSON Lines or JSON5 here"></textarea>
    <div class="dialog-actions"><button value="cancel" type="submit">Cancel</button><button value="open" class="primary" type="submit">Open</button></div>
  </form>
</dialog>
<input id="file-input" type="file" multiple accept=".json,.jsonl,.ndjson,.json5,.txt,.gz,application/json,text/plain" hidden>
<div id="toast" class="toast" role="status" hidden></div>
<script src="model.js?v=2"></script>
<script src="cloud.js?v=2"></script>
<script src="search.js?v=2"></script>
<script src="app.js?v=2"></script>
<script src="/home/app-open.js?v=1" data-app="json"></script>
</body>
</html>
