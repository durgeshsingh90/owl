<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OWL · Compare</title>
  <link rel="icon" href="../bitbucket/assets/owl.png">
  <link rel="stylesheet" href="style.css?v=5">
  <script src="../bitbucket/theme.js?v=20260914-current-mode"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../home/" aria-label="OWL home"><img src="../bitbucket/assets/owl.png" alt=""><span>OWL<small>Compare</small></span></a>
  <div class="views" role="group" aria-label="Show">
    <button type="button" data-view="all" aria-pressed="true">Show all <small id="count-all"></small></button>
    <button type="button" data-view="differences" aria-pressed="false">Differences <small id="count-differences"></small></button>
    <button type="button" data-view="similarities" aria-pressed="false">Similarities <small id="count-similarities"></small></button>
  </div>
  <nav>
    <a href="../home/">Home ↗</a>
    <button id="new-compare" type="button" title="Start a new comparison (the current one stays in Recent)">New</button>
    <div class="recent">
      <button id="recent-toggle" type="button" aria-expanded="false" aria-controls="recent-menu" title="Your 20 most recent comparisons">Recent ▾</button>
      <div id="recent-menu" class="recent-menu" hidden></div>
    </div>
    <button id="share" type="button" title="Copy a link to this comparison; it works while the comparison is among the 20 most recent">Share link</button>
    <button id="theme-toggle" type="button" aria-label="Switch color theme"><span>◐</span></button>
  </nav>
</header>

<div class="toolbar">
  <div class="group" role="group" aria-label="Differences">
    <button type="button" id="block-prev" title="Previous difference (Shift+F7)">↑ Prev</button>
    <span id="block-position" aria-live="polite"></span>
    <button type="button" id="block-next" title="Next difference (F7)">↓ Next</button>
  </div>
  <div class="group" role="group" aria-label="Copy difference">
    <button type="button" id="copy-left" title="Copy this difference from the right side to the left (Alt+←)">← Copy to left</button>
    <button type="button" id="copy-right" title="Copy this difference from the left side to the right (Alt+→)">Copy to right →</button>
  </div>
  <button type="button" id="swap" title="Swap the two sides">⇄ Swap</button>
  <label class="check"><input id="ignore-whitespace" type="checkbox" checked> Ignore leading and trailing spaces</label>
  <label class="check"><input id="ignore-blank-lines" type="checkbox" checked> Ignore empty lines</label>
  <label class="check" title="Wrap long lines on both sides"><input id="word-wrap" type="checkbox"> Wrap long lines</label>
  <div class="legend" aria-label="Colour key">
    <span class="key key-changed">Changed <strong id="count-changed">0</strong></span>
    <span class="key key-removed">Only left <strong id="count-removed">0</strong></span>
    <span class="key key-added">Only right <strong id="count-added">0</strong></span>
  </div>
  <span id="status" class="status" aria-live="polite"></span>
</div>
<p id="notice" class="notice" hidden></p>
<p id="error" class="error" role="alert" hidden></p>

<main class="workspace">
  <section class="pane" data-side="original" aria-label="Left text">
    <div class="pane-head">
      <input class="pane-title" id="original-title" value="Original" aria-label="Left title" maxlength="200">
      <button type="button" class="mini" data-format="original" title="Pretty-print JSON, JSON Lines or JSON5 on the left">{ } Format JSON</button>
      <button type="button" class="mini" data-open="original" title="Load a file into the left side">Open file</button>
      <button type="button" class="mini" data-clear="original" title="Clear the left side">Clear</button>
    </div>
    <div class="editor" id="original-editor" aria-label="Left text"><p class="loading">Loading editor…</p></div>
    <div class="pane-status" id="original-status"></div>
  </section>

  <div class="overview" title="Overview: click to jump"><canvas id="overview"></canvas></div>

  <section class="pane" data-side="modified" aria-label="Right text">
    <div class="pane-head">
      <input class="pane-title" id="modified-title" value="Modified" aria-label="Right title" maxlength="200">
      <button type="button" class="mini" data-format="modified" title="Pretty-print JSON, JSON Lines or JSON5 on the right">{ } Format JSON</button>
      <button type="button" class="mini" data-open="modified" title="Load a file into the right side">Open file</button>
      <button type="button" class="mini" data-clear="modified" title="Clear the right side">Clear</button>
    </div>
    <div class="editor" id="modified-editor" aria-label="Right text"><p class="loading">Loading editor…</p></div>
    <div class="pane-status" id="modified-status"></div>
  </section>
</main>
<input id="file-input" type="file" hidden>
<div id="toast" class="toast" role="status" hidden></div>
<script src="../vendor/monaco/vs/loader.js"></script>
<script src="script.js?v=11"></script>
  <script src="/home/app-open.js?v=1" data-app="compare"></script>
</body>
</html>
